name: CI

on:
  pull_request:
  push:
    branches: [main, fix-clerk-password-recovery-and-secret]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/markai
          JWT_SECRET: ci-only-secret-ci-only-secret-ci
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
          CLERK_SECRET_KEY: sk_test_ci-only-secret-ci-only-secret
